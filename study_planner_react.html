// ===================== UTILS =====================
function getTodayIndex() {
  const jsDay = new Date().getDay(); // 0=Sun, 1=Mon...
  return jsDay === 0 ? 6 : jsDay - 1; // Mon=0, Sun=6
}

function getDaysUntil(dateStr) {
  const target = new Date(dateStr + "T14:00:00");
  const now = new Date();
  const diff = target - now;
  return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
}

function todayKey() {
  return new Date().toISOString().split("T")[0];
}

  toast: (show) => ({ position: "fixed", bottom: 20, left: "50%", transform: `translateX(-50%) ${show ? "translateY(0)" : "translateY(100px)"}`, background: "var(--surface-raised)", color: "var(--text)", padding: "10px 20px", borderRadius: "var(--radius-sm)", border: "1px solid var(--border)", fontSize: 13, zIndex: 200, opacity: show ? 1 : 0, transition: "all 0.3s ease", boxShadow: "var(--shadow)" }),
  authOverlay: { position: "fixed", inset: 0, background: "rgba(11,15,25,0.96)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 },
  authBox: { background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius)", padding: 28, width: "90%", maxWidth: 400 },
  authInput: { width: "100%", padding: "10px 12px", marginBottom: 10, background: "var(--bg)", border: "1px solid var(--border)", borderRadius: "var(--radius-sm)", color: "var(--text)", fontSize: 13, fontFamily: "inherit" },
  authHint: { fontSize: 11, color: "var(--text-muted)", marginTop: 12, lineHeight: 1.5 },
  sectionLabel: { fontSize: 10, fontWeight: 600, color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.8px", marginBottom: 8 },
  badge: (color) => ({ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: color, marginRight: 6 }),
  flexBetween: { display: "flex", justifyContent: "space-between", alignItems: "center" },
  flexEnd: { display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 },
  marginTop: (n) => ({ marginTop: n }),
  marginBottom: (n) => ({ marginBottom: n }),
};

// ===================== COMPONENTS =====================

function CountdownCard({ exam }) {
  const [days, setDays] = useState(getDaysUntil(exam.date));
  useEffect(() => {
    const iv = setInterval(() => setDays(getDaysUntil(exam.date)), 60000);
    return () => clearInterval(iv);
  }, [exam.date]);

  return (
    <div style={styles.countCard(exam.color)} className="animate-in">
      <div style={styles.countSubject}>{exam.subject}</div>
      <div style={styles.countNum}>{days}</div>
      <div style={styles.countLabel}>days left</div>
      <div style={styles.countDate}>
        {new Date(exam.date).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })} · {exam.time}
      </div>
    </div>
  );
}

function CountdownSection() {
  return (
    <div style={styles.countdownGrid}>
      {EXAMS.map(exam => <CountdownCard key={exam.code} exam={exam} />)}
    </div>
  );
}

function TimetableRow({ item }) {
  return (
    <div style={styles.ttRow}>
      <div style={styles.ttTime}><IconClock /> {item.time}</div>
      <div style={{ flex: 1 }}>
        <div style={styles.ttName}>{item.name}</div>
        <div style={styles.ttMeta}>{item.meta}</div>
      </div>
      <div style={styles.ttTag}>{item.tag}</div>
    </div>
  );
}

function StudyRow({ item }) {
  return (
    <div style={styles.studyRow(item.priority)}>
      <div style={styles.studyTime}>{item.time}</div>
      <div style={{ flex: 1 }}>
        <div style={styles.studySubject}>{item.subject}</div>
        <div style={styles.studyTask}>{item.task}</div>
      </div>
      <div style={styles.studyDur}>{item.duration}</div>
    </div>
  );
}

function TimetableSection({ dayIndex }) {
  const day = TIMETABLE[dayIndex];
  return (
    <div style={styles.card}>
      <div style={styles.cardTitle}><IconCalendar /> Timetable & Study Plan</div>
      {day.classes.length > 0 && (
        <>
          <div style={styles.sectionLabel}>Classes</div>
          {day.classes.map((c, i) => <TimetableRow key={i} item={c} />)}
        </>
      )}
      <div style={{ ...styles.sectionLabel, marginTop: 16 }}>Recommended Study Plan</div>
      {day.study.map((s, i) => <StudyRow key={i} item={s} />)}
    </div>
  );
}

function TipSection() {
  const [tipIndex, setTipIndex] = useState(() => Math.floor(Math.random() * TIPS.length));
  const tip = TIPS[tipIndex];

  const nextTip = () => setTipIndex((tipIndex + 1) % TIPS.length);

  return (
    <div style={styles.card}>
      <div style={{ ...styles.cardTitle, cursor: "pointer" }} onClick={nextTip}>
        <IconLightbulb /> Today's Tip <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text-muted)" }}>Tap for next →</span>
      </div>
      <div style={styles.tipBox}>
        <strong style={{ color: "var(--accent)" }}>{tip.title}:</strong> {tip.text}
      </div>
    </div>
  );
}

function WellnessSection({ wellness, setWellness }) {
  const toggle = (key) => setWellness(prev => ({ ...prev, [key]: !prev[key] }));

  return (
    <div style={styles.card}>
      <div style={styles.cardTitle}><IconHeart /> Wellness Check</div>
      <div style={styles.wellnessGrid}>
        <div style={styles.wellnessItem(wellness.water)} onClick={() => toggle("water")}>
          <div style={styles.wellnessIcon(wellness.water)}><IconWater /></div>
          <div style={{ fontSize: 12, fontWeight: 500 }}>Hydration</div>
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 2 }}>3L water</div>
        </div>
        <div style={styles.wellnessItem(wellness.sleep)} onClick={() => toggle("sleep")}>
          <div style={styles.wellnessIcon(wellness.sleep)}><IconMoon /></div>
          <div style={{ fontSize: 12, fontWeight: 500 }}>Sleep</div>
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 2 }}>7-8 hours</div>
        </div>
        <div style={styles.wellnessItem(wellness.meals)} onClick={() => toggle("meals")}>
          <div style={styles.wellnessIcon(wellness.meals)}><IconFood /></div>
          <div style={{ fontSize: 12, fontWeight: 500 }}>Nutrition</div>
          <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 2 }}>3 meals</div>
        </div>
      </div>
    </div>
  );
}

function CheckpointsSection({ checkpoints, setCheckpoints }) {
  const [input, setInput] = useState("");

  const add = () => {
    if (!input.trim()) return;
    setCheckpoints([...checkpoints, { id: Date.now(), text: input.trim(), done: false }]);
    setInput("");
  };

  const toggle = (id) => {
    setCheckpoints(checkpoints.map(cp => cp.id === id ? { ...cp, done: !cp.done } : cp));
  };

  const remove = (id) => {
    setCheckpoints(checkpoints.filter(cp => cp.id !== id));
  };

  return (
    <div style={styles.card}>
      <div style={styles.cardTitle}><IconCheck /> Today's Checkpoints</div>
      {checkpoints.length === 0 && (
        <div style={{ color: "var(--text-muted)", fontSize: 13, padding: "8px 0" }}>No checkpoints yet. Add one below!</div>
      )}
      {checkpoints.map(cp => (
        <div key={cp.id} style={styles.checkpointItem}>
          <input type="checkbox" style={styles.cpCheckbox} checked={cp.done} onChange={() => toggle(cp.id)} />
          <div style={styles.cpText(cp.done)}>{cp.text}</div>
          <button style={styles.btnDanger} onClick={() => remove(cp.id)}><IconTrash /></button>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <input style={styles.cpInput} placeholder="Add a checkpoint (e.g., Finish Chem Chapter 3)" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} />
        <button style={{ ...styles.btn, ...styles.btnPrimary }} onClick={add}><IconPlus /></button>
      </div>
    </div>
  );
}

function ProgressSection() {
  return (
    <div style={styles.card}>
      <div style={styles.cardTitle}><IconChart /> Subject Progress</div>
      {Object.entries(SUBJECT_PROGRESS).map(([sub, data]) => (
        <div key={sub} style={styles.progressItem}>
          <div style={styles.progressLabel}>{sub}</div>
          <div style={styles.progressBarBg}>
            <div style={styles.progressBarFill(data.pct, data.color)}></div>
          </div>
          <div style={styles.progressPct}>{data.pct}%</div>
        </div>
      ))}
    </div>
  );
}

function JournalSection({ journal, setJournal, onSubmit }) {
  return (
    <div style={styles.card}>
      <div style={styles.cardTitle}><IconEdit /> Daily Journal</div>
      <label style={{ ...styles.sectionLabel, marginTop: 0, marginBottom: 6 }}>What struggled you the most today?</label>
      <textarea style={styles.textarea} placeholder="e.g., Couldn't understand chemical bonding concepts..." value={journal.struggled} onChange={e => setJournal({ ...journal, struggled: e.target.value })} />

      <label style={{ ...styles.sectionLabel, marginTop: 12, marginBottom: 6 }}>How did you overcome yesterday's struggle?</label>
      <textarea style={styles.textarea} placeholder="e.g., Watched a video tutorial and practiced 5 problems..." value={journal.overcame} onChange={e => setJournal({ ...journal, overcame: e.target.value })} />

      <label style={{ ...styles.sectionLabel, marginTop: 12, marginBottom: 6 }}>Topics to carry forward tomorrow</label>
      <textarea style={styles.textarea} placeholder="e.g., Need to revise organic chemistry nomenclature..." value={journal.carryForward} onChange={e => setJournal({ ...journal, carryForward: e.target.value })} />

      <div style={styles.flexEnd}>
        <button style={{ ...styles.btn, ...styles.btnOutline }} onClick={() => { localStorage.setItem("journal_draft", JSON.stringify(journal)); }}>Save Draft</button>
        <button style={{ ...styles.btn, ...styles.btnPrimary }} onClick={onSubmit}>Submit Day</button>
      </div>
    </div>
  );
}

function AuthOverlay({ onConnect, onSkip }) {
  const [url, setUrl] = useState(SUPABASE_URL);
  const [key, setKey] = useState(SUPABASE_KEY);

  return (
    <div style={styles.authOverlay}>
      <div style={styles.authBox}>
        <h2 style={{ fontSize: 20, marginBottom: 16 }}>Connect to Supabase</h2>
        <input style={styles.authInput} value={url} onChange={e => setUrl(e.target.value)} placeholder="Supabase Project URL" />
        <input style={styles.authInput} value={key} onChange={e => setKey(e.target.value)} placeholder="Supabase Anon Key" />
        <button style={{ ...styles.btn, ...styles.btnPrimary, width: "100%", marginTop: 4 }} onClick={() => onConnect(url, key)}>
          <IconDatabase /> Connect & Start
        </button>
        <button style={{ ...styles.btn, ...styles.btnOutline, width: "100%", marginTop: 8 }} onClick={onSkip}>
          Use Local Mode (No Sync)
        </button>
        <div style={styles.authHint}>
          Your Supabase project needs two tables: <b>daily_logs</b> and <b>checkpoints</b>.<br/>
          Run the SQL setup script (provided below) in your Supabase SQL Editor first.
        </div>
      </div>
    </div>
  );
}

function Toast({ message, show }) {
  return <div style={styles.toast(show)}>{message}</div>;
}

// ===================== MAIN APP =====================
function App() {
  const [supabase, setSupabase] = useState(null);
  const [connected, setConnected] = useState(false);
  const [showAuth, setShowAuth] = useState(true);
  const [dayIndex, setDayIndex] = useState(getTodayIndex());
  const [wellness, setWellness] = useState({ water: false, sleep: false, meals: false });
  const [checkpoints, setCheckpoints] = useState([]);
  const [journal, setJournal] = useState({ struggled: "", overcame: "", carryForward: "" });
  const [toast, setToast] = useState({ msg: "", show: false });

  // Load from localStorage on mount
  useEffect(() => {
    const savedCP = localStorage.getItem("checkpoints_" + todayKey());
    if (savedCP) setCheckpoints(JSON.parse(savedCP));

    const draft = localStorage.getItem("journal_draft");
    if (draft) setJournal(JSON.parse(draft));

    const savedWellness = localStorage.getItem("wellness_" + todayKey());
    if (savedWellness) setWellness(JSON.parse(savedWellness));
  }, []);

  // Persist checkpoints
  useEffect(() => {
    localStorage.setItem("checkpoints_" + todayKey(), JSON.stringify(checkpoints));
  }, [checkpoints]);

  // Persist wellness
  useEffect(() => {
    localStorage.setItem("wellness_" + todayKey(), JSON.stringify(wellness));
  }, [wellness]);

  const showToast = useCallback((msg) => {
    setToast({ msg, show: true });
    setTimeout(() => setToast({ msg: "", show: false }), 2500);
  }, []);

  const connectSupabase = async (url, key) => {
    try {
      const client = window.supabase.createClient(url, key);
      // Test connection
      const { error } = await client.from("daily_logs").select("count", { count: "exact", head: true });
      if (error && error.code !== "PGRST116") throw error; // PGRST116 = empty table, which is fine

      setSupabase(client);
      setConnected(true);
      setShowAuth(false);
      showToast("Connected to Supabase!");

      // Try to load today's data
      const { data } = await client.from("daily_logs").select("*").eq("date", todayKey()).single();
      if (data) {
        setJournal({
          struggled: data.struggled || "",
          overcame: data.overcame || "",
          carryForward: data.carry_forward || ""
        });
        setWellness({
          water: !!data.water,
          sleep: !!data.sleep,
          meals: !!data.meals
        });
      }

      const { data: cpData } = await client.from("checkpoints").select("*").eq("date", todayKey());
      if (cpData && cpData.length) {
        setCheckpoints(cpData.map(c => ({ id: c.id, text: c.topic, done: c.completed })));
      }
    } catch (e) {
      showToast("Connection failed: " + e.message);
    }
  };

  const skipAuth = () => {
    setShowAuth(false);
    showToast("Running in local mode");
  };

  const submitJournal = async () => {
    const payload = {
      date: todayKey(),
      struggled: journal.struggled,
      overcame: journal.overcame,
      carry_forward: journal.carryForward,
      water: wellness.water ? 1 : 0,
      sleep: wellness.sleep ? 1 : 0,
      meals: wellness.meals ? 1 : 0,
      checkpoints: `${checkpoints.filter(c => c.done).length}/${checkpoints.length}`
    };

    if (supabase) {
      const { error } = await supabase.from("daily_logs").upsert(payload, { onConflict: "date" });
      if (error) {
        showToast("Error: " + error.message);
        return;
      }
      // Sync checkpoints
      for (const cp of checkpoints) {
        await supabase.from("checkpoints").upsert({
          date: todayKey(),
          subject: "General",
          topic: cp.text,
          completed: cp.done
        }, { onConflict: "date,topic" });
      }
    }

    localStorage.setItem("journal_" + todayKey(), JSON.stringify({ ...payload, journal }));
    localStorage.removeItem("journal_draft");
    showToast("Day submitted successfully!");
  };

  return (
    <div style={styles.container}>
      {showAuth && <AuthOverlay onConnect={connectSupabase} onSkip={skipAuth} />}

      <div style={styles.header}>
        <h1 style={styles.headerTitle}>CAT1 Study Planner</h1>
        <p style={styles.headerSub}>
          {new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}
          {connected && <span style={{ color: "var(--success)", marginLeft: 8 }}>● Synced</span>}
        </p>
      </div>

      <CountdownSection />

      <div style={styles.card}>
        <div style={styles.cardTitle}><IconCalendar /> Timetable & Study Plan</div>
        <div style={styles.tabs}>
          {DAY_NAMES.map((name, i) => (
            <button key={i} style={styles.tab(dayIndex === i)} onClick={() => setDayIndex(i)}>{name}</button>
          ))}
        </div>
        <TimetableSection dayIndex={dayIndex} />
      </div>

      <TipSection />
      <WellnessSection wellness={wellness} setWellness={setWellness} />
      <CheckpointsSection checkpoints={checkpoints} setCheckpoints={setCheckpoints} />
      <ProgressSection />
      <JournalSection journal={journal} setJournal={setJournal} onSubmit={submitJournal} />

      <Toast message={toast.msg} show={toast.show} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
